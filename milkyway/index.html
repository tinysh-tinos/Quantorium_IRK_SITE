<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="space">

    
    <!-- Слои звёзд -->
    <div class="stars stars-far"></div>
    <div class="stars stars-near"></div>

    <!-- Сцена -->
    <div class="scene">

      <!-- Галактика -->
      <div class="galaxy">
        <img src="assets/mlechny_pyt.png" alt="Млечный путь" class="galaxy-img">
        <div class="galaxy-halo"></div>
      </div>

      <!-- Звёзды-ссылки -->
      <a href="IT/index.html" class="star star-it">
        <span class="star-dot"></span>
        <span class="label">IT</span>
      </a>

      <a href="VR/index.html" class="star star-vr">
        <span class="star-dot"></span>
        <span class="label">VR</span>
      </a>

      <a href="Nano/index.html" class="star star-nano">
        <span class="star-dot"></span>
        <span class="label">Nano</span>
      </a>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
